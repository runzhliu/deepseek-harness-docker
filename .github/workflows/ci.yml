name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    name: Compose and Helm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: make verify

  image:
    name: Image smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: localhost/deepseek-harness:ci-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            IMAGE_VERSION=0.1.6-alpha.1-r1
            IMAGE_REVISION=${{ github.sha }}
      - run: ./scripts/smoke.sh localhost/deepseek-harness:ci-${{ matrix.suffix }} 0.1.6-alpha.1 10.15.1
      - name: Install rootless Podman Compose
        if: matrix.platform == 'linux/amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose uidmap slirp4netns fuse-overlayfs
          podman info --format '{{.Host.Security.Rootless}}'
          podman compose version
      - name: Import the tested image into rootless Podman
        if: matrix.platform == 'linux/amd64'
        run: docker save localhost/deepseek-harness:ci-amd64 | podman load
      - name: Rootless Podman smoke
        if: matrix.platform == 'linux/amd64'
        run: ./scripts/podman-smoke.sh localhost/deepseek-harness:ci-amd64 0.1.6-alpha.1

  lan-gateway:
    name: HTTPS LAN gateway smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: deepseek-harness:ci-lan
          cache-from: type=gha,scope=lan-amd64
          cache-to: type=gha,mode=max,scope=lan-amd64
          build-args: |
            IMAGE_VERSION=0.1.6-alpha.1-r1
            IMAGE_REVISION=${{ github.sha }}
      - run: CADDY_IMAGE=caddy:2.11.4-alpine ./scripts/lan-smoke.sh deepseek-harness ci-lan

  ungoogled:
    name: Ungoogled Chromium smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: deepseek-harness:ci-ungoogled-${{ matrix.suffix }}
          cache-from: type=gha,scope=ungoogled-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=ungoogled-${{ matrix.suffix }}
          build-args: |
            IMAGE_VERSION=0.1.6-alpha.1-r1-ungoogled.1
            IMAGE_REVISION=${{ github.sha }}
            CHROMIUM_FLAVOR=ungoogled
            UNGOOGLED_CHROMIUM_VERSION=152.0.7977.82-1
            UNGOOGLED_CHROMIUM_AMD64_SHA256=2c6e464e030f87145e42553c5aa539f6e62163ce677d3eace3c51b4fcbd5e347
            UNGOOGLED_CHROMIUM_ARM64_SHA256=1909f42dcc3661bc213f2cf3b5232a9d3c850913b36efa7267ed6499f6cbf87d
      - run: ./scripts/smoke.sh deepseek-harness:ci-ungoogled-${{ matrix.suffix }} 0.1.6-alpha.1 10.15.1 "" ungoogled 152.0.7977.82-1

  optional-market:
    name: Optional market smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg IMAGE_VERSION=0.1.6-alpha.1-r1 --build-arg IMAGE_REVISION=${{ github.sha }} --tag deepseek-harness:ci-market-base-${{ matrix.suffix }} .
      - run: >-
          docker build
          --file Dockerfile.market
          --build-arg BASE_IMAGE=deepseek-harness:ci-market-base-${{ matrix.suffix }}
          --build-arg MARKET_IMAGE_VERSION=0.1.6-alpha.1-r1-market.1
          --tag deepseek-harness:ci-market-${{ matrix.suffix }}
          .
      - run: ./scripts/smoke.sh deepseek-harness:ci-market-${{ matrix.suffix }} 0.1.6-alpha.1 10.15.1 1.38.1
