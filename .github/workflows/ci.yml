name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    name: Compose and Helm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: make verify

  image:
    name: Image smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: deepseek-harness:ci-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            IMAGE_VERSION=0.1.1-rc.2-r2
            IMAGE_REVISION=${{ github.sha }}
      - run: ./scripts/smoke.sh deepseek-harness:ci-${{ matrix.suffix }} 0.1.1-rc.2 10.15.1

  optional-market:
    name: Optional market smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg IMAGE_VERSION=0.1.1-rc.2-r2 --build-arg IMAGE_REVISION=${{ github.sha }} --tag deepseek-harness:ci-market-base-${{ matrix.suffix }} .
      - run: >-
          docker build
          --file Dockerfile.market
          --build-arg BASE_IMAGE=deepseek-harness:ci-market-base-${{ matrix.suffix }}
          --build-arg MARKET_IMAGE_VERSION=0.1.1-rc.2-r2-market.1
          --tag deepseek-harness:ci-market-${{ matrix.suffix }}
          .
      - run: ./scripts/smoke.sh deepseek-harness:ci-market-${{ matrix.suffix }} 0.1.1-rc.2 10.15.1 1.21.0
