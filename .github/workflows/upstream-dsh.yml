name: Upstream DSH version watch

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare GitHub Release and npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the pinned DSH version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/check-upstream-dsh.sh 0.1.2-rc.1 >upstream-report.txt 2>&1
          status="$?"
          echo "status=${status}" >>"${GITHUB_OUTPUT}"
      - name: Show the version report
        if: always()
        run: cat upstream-report.txt
      - name: Create or refresh the upstream tracking issue
        if: steps.upstream.outputs.status == '1' || steps.upstream.outputs.status == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_STATUS: ${{ steps.upstream.outputs.status }}
        run: |
          title="chore: upgrade the pinned DSH release"
          existing_json="$(gh issue list --state open --limit 100 --json number,title,author)"
          existing="$(jq -r --arg title "${title}" 'map(select(.title == $title and .author.is_bot)) | first | .number // empty' <<<"${existing_json}")"
          {
            if [[ "${UPSTREAM_STATUS}" == "1" ]]; then
              echo "The scheduled upstream version check found a newer installable DSH release."
            else
              echo "The scheduled upstream version check found a newer GitHub Release whose matching npm package is not yet available."
              echo
              echo "Keep the current pin until the official npm distribution becomes installable; the next scheduled check will refresh this issue automatically."
            fi
            echo
            echo '```text'
            cat upstream-report.txt
            echo '```'
            echo
            if [[ "${UPSTREAM_STATUS}" == "1" ]]; then
              echo "Update every pinned version together and run the full multi-architecture smoke tests before publishing."
            fi
          } >upstream-issue.md
          if [[ -z "${existing}" ]]; then
            gh issue create --title "${title}" --body-file upstream-issue.md
          else
            gh issue edit "${existing}" --body-file upstream-issue.md
          fi
      - name: Close the resolved upgrade issue
        if: steps.upstream.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="chore: upgrade the pinned DSH release"
          existing_json="$(gh issue list --state open --limit 100 --json number,title,author)"
          existing="$(jq -r --arg title "${title}" 'map(select(.title == $title and .author.is_bot)) | first | .number // empty' <<<"${existing_json}")"
          if [[ -n "${existing}" ]]; then
            gh issue close "${existing}" --comment "Resolved: the pinned DSH version now matches the latest installable upstream release."
          fi
      - name: Fail when an upgrade or check error requires action
        if: steps.upstream.outputs.status == '1' || steps.upstream.outputs.status == '2'
        run: exit 1
