apiVersion: v2
name: deepseek-harness
description: Community Helm chart for a single-user DeepSeek Harness Web instance
type: application
version: 0.1.16
appVersion: "0.1.7-rc.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/runzhliu/deepseek-harness-docker
keywords:
  - deepseek
  - agent
  - harness
  - ai
maintainers:
  - name: runzhliu
    url: https://github.com/runzhliu
sources:
  - https://github.com/runzhliu/deepseek-harness-docker
  - https://github.com/deepseek-ai/deepseek-harness
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: deepseek-harness
      image: docker.io/runzhliu/deepseek-harness:0.1.7-rc.1-r1
  artifacthub.io/changes: |
    - kind: changed
      description: Upgrade the official runtime and Browser Use packages to 0.1.7-rc.1.
    - kind: added
      description: Include upstream Web terminals, session archive management, MCP Resources, resumable Headless sessions, remote SSH workspaces, Browser Use, and Computer Use.
    - kind: changed
      description: Track the renamed PTC/workflow services and removal of the legacy E2B execution backend.
