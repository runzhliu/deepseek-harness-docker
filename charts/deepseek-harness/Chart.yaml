apiVersion: v2
name: deepseek-harness
description: Community Helm chart for a single-user DeepSeek Harness Web instance
type: application
version: 0.1.10
appVersion: "0.1.6-alpha.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/runzhliu/deepseek-harness-docker
keywords:
  - deepseek
  - agent
  - harness
  - ai
maintainers:
  - name: runzhliu
    url: https://github.com/runzhliu
sources:
  - https://github.com/runzhliu/deepseek-harness-docker
  - https://github.com/deepseek-ai/deepseek-harness
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: deepseek-harness
      image: runzhliu/deepseek-harness:0.1.6-alpha.1-r1
  artifacthub.io/changes: |
    - kind: added
      description: Add the Web sidebar terminal, archived-session recovery, MCP Resources, and experimental Browser and Computer Use from DSH 0.1.6-alpha.1.
    - kind: changed
      description: Adopt the new DeepSeek Messages default and the renamed PTC and workflow services.
    - kind: fixed
      description: Include optional-plugin startup isolation, persistent Bash, session ordering, and Web reconnect fixes.
