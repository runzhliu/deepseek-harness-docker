services:
  deepseek-harness:
    build:
      dockerfile: Dockerfile.market
      args:
        BASE_IMAGE: ${DSH_IMAGE_REPOSITORY:-runzhliu/deepseek-harness}:${DSH_IMAGE_VERSION:-0.1.1-rc.2-r2}
        DSH_MARKET_VERSION: ${DSH_MARKET_VERSION:-1.21.0}
        MARKET_IMAGE_VERSION: ${MARKET_IMAGE_VERSION:-0.1.1-rc.2-r2-market.1}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-trixie}
